<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>돈 관리 앱</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 첫 화면이 번쩍이지 않도록 저장된 테마(없으면 시스템 설정)를 먼저 적용한다.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <div class="page">
    <header>
      <div class="title-row">
        <div>
          <h1><span class="hl">돈 관리 자동화 앱</span></h1>
          <p class="sub">카드·통장 엑셀을 끌어다 놓으면 가계부·새는 돈·카드·통장 쪼개기·주간 브리핑까지</p>
        </div>
        <div class="title-side">
          <span class="lock">🔒 파일은 내 컴퓨터 밖으로 나가지 않아요</span>
          <button id="btn-theme" class="chip" type="button" aria-label="화면 모드 전환"></button>
        </div>
      </div>
    </header>
    <div id="alert" class="alert hidden"></div>
    <section id="drop-area"></section>
    <div class="actions">
      <button id="btn-demo" class="chip">예시 데이터로 먼저 보기(가상 인물 김혼잡)</button>
      <button id="btn-export" class="chip">가계부 엑셀로 저장</button>
      <span id="count" class="muted"></span>
    </div>
    <nav id="tabs"></nav>
    <main id="view"></main>
  </div>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
